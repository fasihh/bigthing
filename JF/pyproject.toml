[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionlab"
version = "1.0.0"
description = "Uncertainty-aware multimodal fusion with variational JEPA experts on CMU-MOSEI"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
